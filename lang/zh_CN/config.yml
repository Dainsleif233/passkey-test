title: 通行密钥设置

rp_id:
  title: RP ID
  description: 依赖方 ID（域名）。留空则使用当前域名。

rp_name:
  title: RP 名称
  description: 依赖方显示名称。留空则使用站点名称。
  placeholder: 我的站点

user_verification:
  title: 用户验证
  description: 通行密钥认证的用户验证级别。

show_login_button:
  title: 显示登录按钮
  description: 在登录页面显示通行密钥登录按钮。

remember_login:
  title: 记住登录
  description: 记住通行密钥登录会话。

max_passkeys:
  title: 每用户最大通行密钥数
  description: 用户可注册的最大通行密钥数量。
